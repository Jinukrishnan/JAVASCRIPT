<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5 pt-5">

        <div class="w-50 m-auto">
            <form class="row g-3 needs-validation" id="frm" enctype="multipart/form-data" >
                <div class="col-md-6 position-relative">
                  <label for="validationTooltip01" class="form-label">First name</label>
                  <input type="text" class="form-control" id="validationTooltip01" name="fname" required>
                  <div class="valid-tooltip">
                    Looks good!
                  </div>
                </div>
                <div class="col-md-6 position-relative">
                  <label for="validationTooltip02" class="form-label">Last name</label>
                  <input type="text" class="form-control" id="validationTooltip02" name="lname"  required>
                  <div class="valid-tooltip">
                    Looks good!
                  </div>
                </div>
                <div class="col-md-6 position-relative">
                    <label for="validationTooltip03" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="validationTooltip03" name="phone" required>
                    <div class="invalid-tooltip">
                      Please provide a valid city.
                    </div>
                  </div>
                <div class="col-md-6 position-relative">
                    <label for="validationTooltipUsername" class="form-label">Upload Image</label>
                    <div class="input-group has-validation">
                      
                      <input class="form-control" name="formFile" type="file" id="formFile">
                      <div class="invalid-tooltip">
                        Please choose a unique and valid username.
                      </div>
                    </div>
                  </div>
             
              
                <div class="col-3 mt-3 m-auto">
                  <button class="btn btn-primary" type="submit">Submit form</button>
                </div>
              </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script>
document.getElementById('frm').addEventListener('submit',(e)=>{
    e.preventDefault();
    // const firstname = e.target.fname.value;
    // console.log("firstName : ", firstname)
    // console.log(e.target);
    const data=new FormData(e.target);
    console.log("req data : ",data);
    fetch('http://localhost:3000/api/add',{
        method:"POST",
        
        body:data
    }).then((res)=>{console.log(res);}).catch((error)=>{console.log(error);})
})
    </script>
  </body>
</html>
