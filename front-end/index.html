<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  </head>
  <body>
    
    <div class="container mt-5">
        <div class="ms-auto"style='width: 200px;'>
            <a href="./addContact.html" class="btn btn-primary">Add Contact</a>
        </div>
    </div>
    <div class="container">
      <div class="row" id="row">
        
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
  <script>
    async function getContact(){
      const res= await fetch('http://localhost:3000/api/get')
      console.log(res);
      const data=await res.json();
      console.log(data);
      str=``
      data.map((dt)=>{
        console.log(dt.profile);
          str+=`  <div class="col-lg-3 col-md-4 col-sm-2">
            <div class="card" style="width: 14rem;">
              <img src="http://localhost:3000/api/image/${dt.profile.filename}" class="card-img-top" alt="...">
              <div class="card-body">
                <h5 class="card-title">${dt.fname} ${dt.lname}</h5>
                <p class="card-text"></p>
              </div>
             
              <div class="card-body">
                <a href="#" onClick="deleteData('${dt.profile.filename}')" class="card-link">Delete</a>
                <a href="#" class="card-link">Another link</a>
              </div>
            </div>
          </div>`
      })
      document.getElementById('row').innerHTML=str
    }
    getContact()


   async  function deleteData(filename){
      console.log(filename);
      const res=await fetch(`http://localhost:3000/api/del/${filename}`,{method:"DELETE"})
      console.log(res);
    }
  </script>
</html>
