<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cards {
            display: flex;
            flex-wrap: wrap;
            margin: 20px;

        }

        .card {
            width: 12rem;
            height: 17rem;
            border: 1px solid black;
        }

        .image {
            width: 100%;
            height: 50%;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="cards" id="cards">

    </div>





    <script>
        async function getUsers() {
            const res = await fetch("http://localhost:3000/api/getusers");
            console.log(res);
            const users = await res.json();
            str = ``
            users.map((user) => {
                console.log(user.image.filename);

                str += `
         <div class="card">
            <div class="image">
                <img src="http://localhost:3000/api/image/${user.image.filename}" alt="">
            </div>
            <h3>${user.username}</h3>
            <p>${user.email}</p>
            <button onclick="deleteData('${user._id}')">Delete</button>
        </div>
`
            })

            document.getElementById("cards").innerHTML = str
        }
        getUsers()


        async function deleteData(_id) {
            console.log(_id);
            const res= await fetch(`http://localhost:3000/api/delete/${_id}`,{method:"DELETE"})
            console.log(res);
            
        }
    </script>
</body>

</html>
